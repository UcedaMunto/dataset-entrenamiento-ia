# Configuración para entrenar MobileNetV3-Small DESDE CERO (pesos ImageNet).
# Corrige la versión anterior: para iniciar desde cero las cabezas se inicializan
# aleatoriamente y necesitan learning_rate 0.001 (no 0.0001, que es la tasa de
# continuación/fine-tune). La receta replica la ejecución original exitosa del
# 18/10/2026 (default.yaml): warmup de 3 épocas con backbone congelado y después
# ajuste fino completo con parada temprana. No detener el entrenamiento durante
# el warmup: la parada temprana solo actúa después de descongelar el backbone.
dataset_root: /app/dataset
database: /app/dataset/metadata.sqlite
model_dir: /app/modelo-ia/runs

# 224 px es la resolución nativa de los pesos ImageNet de MobileNetV3-Small.
image_size: 224
batch_size: 64
epochs: 30
learning_rate: 0.001
num_workers: 8
pretrained: true
seed: 42
multilabel_threshold: 0.5

# Fase 1: 3 épocas solo cabezas (backbone congelado); fase 2: ajuste fino completo.
finetune: true
warmup_epochs: 3
finetune_lr: 0.0001
weight_decay: 0.0001
augment: true
class_weighted: true
label_smoothing: 0.05
amp: true
early_stopping_patience: 5

# Registro de imágenes usadas por ejecución (SQLite aparte; el dataset es de solo lectura).
ledger: /app/modelo-ia/registro_entrenamiento.sqlite
