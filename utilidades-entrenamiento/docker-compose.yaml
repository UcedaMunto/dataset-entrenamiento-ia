x-training: &training
  image: modelo-reconocimiento-entrenamiento:local
  build:
    context: .
    dockerfile: Dockerfile
  init: true
  user: "${TRAINING_UID:-1000}:${TRAINING_GID:-1000}"
  shm_size: 2g
  volumes:
    - ../dataset:/app/dataset:ro
    - ./modelo-ia:/app/modelo-ia
    - ./modelos-compartidos:/app/modelos-compartidos:ro
  environment:
    TORCH_HOME: /app/modelo-ia/cache
    PYTHONUNBUFFERED: "1"
  command: ["train", "--config", "/app/configs/default.yaml"]

services:
  train:
    <<: *training

  train-gpu:
    <<: *training
    profiles: ["gpu"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  monitor: &monitor
    image: modelo-reconocimiento-entrenamiento:local
    init: true
    user: "${TRAINING_UID:-1000}:${TRAINING_GID:-1000}"
    shm_size: 2g
    entrypoint: ["python", "/app/monitor.py"]
    environment:
      TORCH_HOME: /app/modelo-ia/cache
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../dataset:/app/dataset:ro
      - ./modelo-ia:/app/modelo-ia
    ports:
      - "127.0.0.1:8090:8090"
    profiles: ["monitor"]

  monitor-gpu:
    <<: *monitor
    profiles: ["monitor-gpu"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
